name: Keep Supabase awake

# Free-tier Supabase projects auto-pause after a period of no API activity, which
# silently breaks login, sign-up, and the leaderboard on the live site. This makes
# one lightweight, read-only request daily so the project always looks active.
on:
  schedule:
    - cron: "0 18 * * *" # 18:00 UTC daily
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sS --fail -o /dev/null -w "HTTP %{http_code}\n" \
            "${VITE_SUPABASE_URL}/rest/v1/leaderboard?select=username&limit=1" \
            -H "apikey: ${VITE_SUPABASE_ANON_KEY}"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
