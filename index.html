<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      GitHub Pages can't set custom HTTP headers for a static site, so this
      meta-tag CSP is the strongest policy available here. Note: the CSP
      spec doesn't allow `frame-ancestors` in a <meta> tag — that directive
      is silently ignored by browsers in this context, so clickjacking
      protection isn't achievable without server-controlled headers.
    -->
    <!--
      The sha256 in script-src allows exactly the JSON-LD block below and
      nothing else inline — if you edit that block's content, recompute the
      hash (see scripts/hash-jsonld.mjs) or the structured data silently
      stops loading (CSP failures don't throw visible errors here).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-xAwbvMO1d+EoW3wYhNJTFpESkmkLdMaxJ90UdgfLkxI=' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https://oldschool.runescape.wiki data:; font-src https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; base-uri 'self'; form-action 'self'; object-src 'none'"
    />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3e3529" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Every boss/item icon on the site loads from here — dozens of
         requests per page load — so the DNS+TLS handshake is worth paying
         for before the first icon is actually requested rather than at it. -->
    <link rel="preconnect" href="https://oldschool.runescape.wiki" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!--
      Title and description are sized to Google's SERP snippet budget
      (roughly 60 chars / 155-160 chars before truncation) — the previous
      title ran to 66 and got cut off mid-word in search results. Both still
      carry the two phrases people actually search ("OSRS" and "Old School
      RuneScape"), just without repeating "Drop ... Simulator" twice.
    -->
    <title>OSRS Drop Simulator — Old School RuneScape Drop Rates</title>
    <meta
      name="description"
      content="Simulate real OSRS boss drop tables for 65 bosses. Grind GP, unlock new bosses, open clue caskets, and climb the global leaderboard. Free, in your browser."
    />
    <meta name="keywords" content="OSRS, Old School RuneScape, drop simulator, drop rate calculator, OSRS bosses, OSRS drop table, RuneScape simulator, loot simulator" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://osrsdropsimulation.com/" />
    <meta name="google-site-verification" content="MNBnVokaq_bTqXbI0cEpVdQjvqg2oVt9ai-go92JJJA" />

    <!-- Open Graph / Discord / Facebook link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OSRS Drop Simulator" />
    <meta property="og:title" content="OSRS Drop Simulator — Old School RuneScape Drop Rates" />
    <meta
      property="og:description"
      content="Simulate real OSRS boss drop tables for 65 bosses. Grind GP, unlock new bosses, open clue caskets, and climb the global leaderboard. Free, in your browser."
    />
    <meta property="og:url" content="https://osrsdropsimulation.com/" />
    <meta property="og:image" content="https://osrsdropsimulation.com/brand/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter/X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OSRS Drop Simulator — Old School RuneScape Drop Rates" />
    <meta
      name="twitter:description"
      content="Simulate real OSRS boss drop tables for 65 bosses. Grind GP, unlock new bosses, and climb the global leaderboard."
    />
    <meta name="twitter:image" content="https://osrsdropsimulation.com/brand/og-image.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "OSRS Drop Simulator",
        "url": "https://osrsdropsimulation.com/",
        "description": "A free browser-based drop rate simulator for Old School RuneScape bosses, covering 65 bosses with real drop tables, a GP economy, and a global leaderboard.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any (web browser)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      The game itself is client-rendered, so with JavaScript off this page
      would otherwise be blank. This gives a non-JS visitor something real:
      what the site is, and links to the parts that ARE static HTML and work
      without JavaScript (the boss drop tables and the FAQ). It also gives a
      crawler a link path into the rest of the site on its first, pre-render
      pass — every link here is a genuine, visible navigation option, not
      hidden text.
    -->
    <noscript>
      <div style="max-width: 640px; margin: 0 auto; padding: 32px 20px; font-family: system-ui, sans-serif; color: #ffe4a3;">
        <h1 style="font-size: 22px; margin: 0 0 12px;">OSRS Drop Simulator</h1>
        <p style="line-height: 1.6; color: #d9c8a0;">
          A free Old School RuneScape drop-rate simulator: pick a boss, roll its real drop table, and fill a
          28-slot inventory with loot. The simulator itself needs JavaScript, but these pages work without it:
        </p>
        <ul style="line-height: 2;">
          <li><a href="/bosses/" style="color: #ffb700;">All boss drop tables</a> — every boss, with exact drop rates</li>
          <li><a href="/faq/" style="color: #ffb700;">FAQ</a> — how the drop rates, GP and unlocks work</li>
          <li><a href="/pet-drop-sim/" style="color: #ffb700;">Pet Drop Simulator</a></li>
        </ul>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
